<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create your free Sugar Bliss Bakery account to order custom birthday cakes and unlock member offers." />
  <title>Sign Up — Sugar Bliss Bakery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23E87578' stroke-width='1.8'%3E%3Cpath d='M20 10c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v10h16V10z'/%3E%3Cpath d='M4 14h16M8 10V6M16 10V6M12 10V4'/%3E%3C/svg%3E" />
</head>
<body>
<div class="page-transition" aria-hidden="true"></div>

<main class="auth-shell">
  <div class="auth-card auth-card--wide" role="form" aria-labelledby="signup-heading">
    <a href="index.html" class="nav-logo auth-brand" aria-label="Sugar Bliss Bakery Home">
      <span class="nav-logo-icon" aria-hidden="true"><svg class="icon icon-xl icon-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v10h16V10z"/><path d="M4 14h16"/><path d="M8 10V6"/><path d="M16 10V6"/><path d="M12 10V4"/><path d="M8 4c0-1.1.9-2 2-2h4c1.1 0 2 .9 2 2"/></svg></span>
      <span class="nav-logo-text">Sugar<span>Bliss</span></span>
    </a>

    <h1 class="auth-title" id="signup-heading">Create Account</h1>
    <p class="auth-subtitle">Create an account to get started.</p>

    <form data-validate id="signup-form" aria-label="Signup form" novalidate>
      <div class="form-group">
        <label class="form-label" for="signup-name">Full Name</label>
        <input type="text" id="signup-name" name="name" class="form-control" placeholder="Your full name" required aria-required="true" autocomplete="name" />
        <span class="form-error" role="alert">Please enter your full name.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-email">Email Address</label>
        <input type="email" id="signup-email" name="email" class="form-control" placeholder="you@example.com" required aria-required="true" autocomplete="email" />
        <span class="form-error" role="alert">Please enter a valid email address.</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="signup-phone">Phone Number <span style="font-weight:500; color:var(--gray-300);">(optional)</span></label>
        <input type="tel" id="signup-phone" name="phone" class="form-control" placeholder="+44 7700 900000" autocomplete="tel" />
        <span class="form-error" role="alert">Please enter a valid phone number.</span>
      </div>

      <div class="auth-grid-2">
        <div class="form-group auth-pw-wrap">
          <label class="form-label" for="signup-password">Password</label>
          <input type="password" id="signup-password" name="password" class="form-control" placeholder="At least 8 characters" required aria-required="true" minlength="8" autocomplete="new-password" />
          <button type="button" class="auth-pw-toggle" data-pw-toggle="signup-password" aria-label="Show password" aria-pressed="false"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <span class="form-error" role="alert">Password must be at least 8 characters.</span>
        </div>

        <div class="form-group auth-pw-wrap">
          <label class="form-label" for="signup-confirm">Confirm Password</label>
          <input type="password" id="signup-confirm" name="confirm-password" class="form-control" placeholder="Repeat your password" required aria-required="true" autocomplete="new-password" data-confirm-password />
          <button type="button" class="auth-pw-toggle" data-pw-toggle="signup-confirm" aria-label="Show password" aria-pressed="false"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <span class="form-error" role="alert">Passwords must match.</span>
        </div>
      </div>

      <div class="form-group">
        <label class="auth-legal" for="signup-terms">
          <input type="checkbox" id="signup-terms" data-terms required aria-required="true" />
          <span>I agree to the <a href="terms.html" class="auth-link">Terms &amp; Conditions</a> and <a href="privacy.html" class="auth-link">Privacy Policy</a>.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg auth-submit" data-original="Create Account">Create Account</button>
    </form>

    <div class="divider-text" aria-hidden="true">or sign up with</div>

    <button type="button" class="social-auth-btn" data-social="Google" aria-label="Sign up with Google">
      <svg class="icon icon-sm" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
      Google
    </button>
    <button type="button" class="social-auth-btn" data-social="Facebook" aria-label="Sign up with Facebook">
      <svg class="icon icon-sm" viewBox="0 0 24 24" aria-hidden="true" style="color:#1877F2;"><path fill="currentColor" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
      Facebook
    </button>

    <p class="auth-redirect">Already have an account? <a href="login.html" class="auth-link">Sign In</a></p>
  </div>
</main>

<div class="toast-container" aria-live="polite"></div>
<script src="js/main.js"></script>
</body>
</html>
